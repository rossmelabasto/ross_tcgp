[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ross_tcgp"
version = "0.2.2"
description = "Read your Pokémon TCG Pocket collection from an Android phone over adb (fan project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rossmel Abasto" }]
keywords = ["pokemon", "tcg-pocket", "adb", "android", "collection", "image-recognition"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = ["pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/rossmelabasto/ross_tcgp"

[project.scripts]
ross-tcgp = "ross_tcgp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ross_tcgp"]
